name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PRs receive read-only repository permissions. Only the deploy job can publish.
permissions:
  contents: read

# Keep an active production deployment running; queue the latest revision.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js for numerical tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check src/optics.js
          node --check src/worker.js
          node --check src/svg-import.js
          node --check src/gaming.js
          node --check src/tape-tools.js
          node --check src/view3d.js
          node --check src/app.js

      - name: Build standalone HTML and Pages payload
        run: python build.py

      - name: Test build, payload and project-site paths
        run: python -m unittest discover -s tests -p "test_build.py" -v

      - name: Test optical calculations
        run: node --test tests/test_optics.js tests/test_led_profiles.js tests/test_svg.js tests/test_tape_tools.js tests/test_gaming.js tests/test_view3d.js

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Test browser UI over HTTP
        run: |
          python tests/test_browser.py
          python tests/test_features.py
          python tests/test_interactions.py

      - name: Upload only the built website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
